<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#060913">
<title>YASIN BHAI | Secret Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --bg-base: #060913;
  --bg-card: rgba(13, 19, 36, 0.75);
  --border-card: rgba(0, 242, 254, 0.18);
  --accent-cyan: #00f2fe;
  --accent-blue: #4facfe;
  --accent-purple: #7f00ff;
  --accent-pink: #ff2d95;
  --accent-red: #ff3366;
  --accent-green: #00ff88;
  --accent-amber: #ffaa00;
  --text-main: #f0f4fc;
  --text-muted: #8e9bb5;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overscroll-behavior: none; }
body {
  background: var(--bg-base);
  background-image: radial-gradient(circle at 15% 15%, rgba(127,0,255,0.25) 0%, transparent 45%),
                    radial-gradient(circle at 85% 85%, rgba(255,45,149,0.22) 0%, transparent 45%);
  color: var(--text-main);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background-attachment: fixed;
  overflow-x: hidden;
}
body::before, body::after {
  content: '';
  position: absolute;
  width: 300px; height: 300px;
  border-radius: 50%;
  filter: blur(120px);
  pointer-events: none;
}
body::before { background: rgba(0,242,254,0.15); top: 10%; left: 10%; animation: floatOrb 8s ease-in-out infinite; }
body::after { background: rgba(255,45,149,0.18); bottom: 10%; right: 10%; animation: floatOrb 10s ease-in-out infinite reverse; }
@keyframes floatOrb { 0%,100% { transform: translate(0,0) scale(1);} 50% { transform: translate(30px,-30px) scale(1.1);} }

.card {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: 24px;
  width: 100%;
  max-width: 520px;
  padding: 32px 24px;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 40px rgba(255,45,149,0.10);
  position: relative;
  z-index: 10;
  overflow: hidden;
  animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(24px);} to { opacity: 1; transform: translateY(0);} }
.card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
  background-size: 200% 100%;
  animation: shimmer 4s linear infinite;
}
@keyframes shimmer { 0% { background-position: 0% 0; } 100% { background-position: 200% 0; } }

.brand { text-align: center; margin-bottom: 22px; }
.logo {
  width: 60px; height: 60px; margin: 0 auto 12px;
  background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; color: #fff;
  box-shadow: 0 0 30px rgba(255,45,149,0.45);
  animation: pulseGlow 3s ease-in-out infinite;
}
@keyframes pulseGlow { 0%,100% { box-shadow: 0 0 30px rgba(255,45,149,0.45);} 50% { box-shadow: 0 0 45px rgba(255,45,149,0.75);} }
.brand h1 {
  font-size: 22px; font-weight: 800; letter-spacing: 2px;
  background: linear-gradient(90deg, #fff, var(--accent-pink), #fff);
  background-size: 200% auto;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  animation: textShine 3.5s linear infinite;
}
@keyframes textShine { 0% { background-position: 0% center;} 100% { background-position: 200% center;} }
.brand p { font-size: 12px; color: var(--text-muted); margin-top: 6px; }

.form-group { margin-bottom: 14px; }
.form-group label {
  display: block; font-size: 11px; font-weight: 700;
  color: var(--text-muted); margin-bottom: 6px;
  text-transform: uppercase; letter-spacing: 0.6px;
}
.input-wrap { position: relative; }
.input-wrap i {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  color: var(--text-muted); font-size: 14px; pointer-events: none;
}
.input {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1.5px solid rgba(255,255,255,0.09);
  border-radius: 12px;
  padding: 13px 14px 13px 40px;
  color: #fff;
  font-size: 15px;
  outline: none;
  transition: all 0.25s;
  -webkit-appearance: none;
}
.input::placeholder { color: rgba(142,155,181,0.6); font-size: 14px; }
.input:focus {
  border-color: var(--accent-cyan);
  background: rgba(0,242,254,0.05);
  box-shadow: 0 0 0 4px rgba(0,242,254,0.08);
}

.name-preview {
  margin-top: 8px;
  padding: 10px 12px;
  background: rgba(0,242,254,0.06);
  border: 1px dashed rgba(0,242,254,0.35);
  border-radius: 10px;
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 8px;
}
.name-preview i { color: var(--accent-cyan); font-size: 13px; }
.name-preview .preview-code {
  font-family: 'JetBrains Mono', monospace;
  color: var(--accent-cyan);
  font-weight: 700;
  letter-spacing: 1px;
  word-break: break-all;
}

.btn {
  width: 100%;
  padding: 13px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
  color: #040914;
  font-size: 14px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 6px 20px rgba(0,242,254,0.35);
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin-top: 6px;
  -webkit-appearance: none;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(0,242,254,0.55); }
.btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.btn.secondary {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--text-main);
  box-shadow: none;
}
.btn.secondary:hover { background: rgba(255,255,255,0.1); }
.btn.danger {
  background: linear-gradient(135deg, var(--accent-red), #ff6699);
  color: #fff;
  box-shadow: 0 6px 20px rgba(255,51,102,0.35);
}
.btn.danger:hover { box-shadow: 0 10px 28px rgba(255,51,102,0.55); }

.alert {
  background: rgba(255,51,102,0.12);
  border: 1px solid rgba(255,51,102,0.35);
  color: var(--accent-red);
  padding: 11px 13px;
  border-radius: 11px;
  font-size: 13px;
  margin-bottom: 16px;
  display: none;
  align-items: center;
  gap: 9px;
}
.alert.show { display: flex; animation: shake 0.4s; }
.alert.success {
  background: rgba(0,255,136,0.12);
  border-color: rgba(0,255,136,0.35);
  color: var(--accent-green);
}
@keyframes shake { 0%,100% { transform: translateX(0);} 20% { transform: translateX(-6px);} 40% { transform: translateX(6px);} 60% { transform: translateX(-4px);} 80% { transform: translateX(4px);} }

.time-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.time-box label { display: block; font-size: 10px; font-weight: 700; color: var(--text-muted); text-align: center; margin-bottom: 4px; text-transform: uppercase; }
.time-box input {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1.5px solid rgba(255,255,255,0.09);
  border-radius: 10px;
  padding: 10px;
  color: #fff; font-size: 16px; font-weight: 700; text-align: center;
  outline: none; font-family: 'JetBrains Mono', monospace;
  -webkit-appearance: none;
}
.time-box input:focus { border-color: var(--accent-cyan); background: rgba(0,242,254,0.05); }

.key-result {
  background: rgba(0,255,136,0.08);
  border: 1px solid rgba(0,255,136,0.3);
  border-radius: 12px;
  padding: 14px;
  margin-top: 14px;
  text-align: center;
  display: none;
}
.key-result.show { display: block; }
.key-result .key-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
.key-result .key-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  font-weight: 800;
  color: var(--accent-green);
  letter-spacing: 2px;
  word-break: break-all;
}
.key-result .copy-btn {
  margin-top: 10px;
  background: rgba(0,255,136,0.15);
  border: 1px solid rgba(0,255,136,0.4);
  color: var(--accent-green);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
  display: inline-flex; align-items: center; gap: 6px;
}
.key-result .copy-btn:hover { background: rgba(0,255,136,0.25); }

.keys-list {
  max-height: 340px;
  overflow-y: auto;
  margin-top: 14px;
  display: none;
}
.keys-list.show { display: block; }
.keys-list::-webkit-scrollbar { width: 5px; }
.keys-list::-webkit-scrollbar-thumb { background: rgba(0,242,254,0.25); border-radius: 3px; }

.key-item {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  transition: all 0.2s;
}
.key-item:hover { border-color: rgba(0,242,254,0.3); background: rgba(19,27,50,0.7); }
.key-item .info { min-width: 0; flex: 1; }
.key-item .key-code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 700;
  color: var(--accent-cyan);
  letter-spacing: 1px;
  word-break: break-all;
}
.key-item .key-meta {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 3px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.key-item .tag {
  font-size: 9px;
  padding: 1px 6px;
  border-radius: 4px;
  font-weight: 700;
  text-transform: uppercase;
  white-space: nowrap;
}
.tag.green { background: rgba(0,255,136,0.15); color: var(--accent-green); }
.tag.red { background: rgba(255,51,102,0.15); color: var(--accent-red); }
.tag.amber { background: rgba(255,170,0,0.15); color: var(--accent-amber); }
.tag.cyan { background: rgba(0,242,254,0.15); color: var(--accent-cyan); }
.tag.purple { background: rgba(127,0,255,0.15); color: #b388ff; }

.key-item .actions { display: flex; gap: 5px; flex-shrink: 0; }
.key-item .mini-btn {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--text-muted);
  width: 30px; height: 30px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 11px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.key-item .mini-btn:hover { color: var(--accent-cyan); border-color: var(--accent-cyan); }
.key-item .mini-btn.danger:hover { color: var(--accent-red); border-color: var(--accent-red); }
.key-item.revoked { opacity: 0.5; }
.key-item.revoked .key-code { color: var(--text-muted); text-decoration: line-through; }

.back-link {
  display: block;
  text-align: center;
  margin-top: 18px;
  font-size: 12px;
  color: var(--text-muted);
  text-decoration: none;
  transition: color 0.2s;
  font-weight: 600;
  letter-spacing: 0.4px;
}
.back-link:hover { color: var(--accent-cyan); }
.back-link i { margin-right: 5px; }

.empty-msg {
  text-align: center;
  padding: 20px;
  font-size: 13px;
  color: var(--text-muted);
}

.preset-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-bottom: 10px;
}
.preset-btn {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.09);
  color: var(--text-muted);
  font-size: 10px;
  font-weight: 700;
  padding: 7px 4px;
  border-radius: 8px;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  transition: all 0.2s;
}
.preset-btn:hover, .preset-btn.active {
  background: rgba(0,242,254,0.12);
  border-color: var(--accent-cyan);
  color: var(--accent-cyan);
}

/* TABS */
.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 18px;
  background: rgba(255,255,255,0.03);
  padding: 5px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.06);
}
.tab-btn {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 700;
  padding: 10px 8px;
  border-radius: 9px;
  cursor: pointer;
  transition: all 0.25s;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.tab-btn.active {
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
  color: #040914;
  box-shadow: 0 4px 12px rgba(0,242,254,0.3);
}
.tab-btn:not(.active):hover {
  color: var(--text-main);
  background: rgba(255,255,255,0.05);
}

/* SAVED ACCOUNTS LIST */
.saved-list {
  max-height: 460px;
  overflow-y: auto;
  margin-top: 14px;
  display: none;
}
.saved-list.show { display: block; }
.saved-list::-webkit-scrollbar { width: 5px; }
.saved-list::-webkit-scrollbar-thumb { background: rgba(127,0,255,0.25); border-radius: 3px; }

.saved-item {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 10px;
  transition: all 0.2s;
}
.saved-item:hover { border-color: rgba(127,0,255,0.4); background: rgba(19,27,50,0.7); }
.saved-item .top-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.saved-item .nick {
  font-size: 14px;
  font-weight: 700;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  flex-wrap: wrap;
}
.saved-item .nick .region-badge {
  background: rgba(127,0,255,0.2);
  color: #b388ff;
  padding: 2px 8px;
  border-radius: 5px;
  font-size: 10px;
  font-weight: 700;
  border: 1px solid rgba(127,0,255,0.3);
  text-transform: uppercase;
}
.saved-item .nick .level-badge {
  background: rgba(0,242,254,0.15);
  color: var(--accent-cyan);
  padding: 2px 8px;
  border-radius: 5px;
  font-size: 10px;
  font-weight: 700;
  border: 1px solid rgba(0,242,254,0.3);
}
.saved-item .nick .type-badge {
  background: rgba(0,255,136,0.15);
  color: var(--accent-green);
  padding: 2px 8px;
  border-radius: 5px;
  font-size: 10px;
  font-weight: 700;
  border: 1px solid rgba(0,255,136,0.3);
  text-transform: uppercase;
}
.saved-item .nick .type-badge.token {
  background: rgba(255,170,0,0.15);
  color: var(--accent-amber);
  border-color: rgba(255,170,0,0.3);
}

/* ONLINE / OFFLINE BADGE */
.online-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  white-space: nowrap;
}
.online-badge.online {
  background: rgba(0,255,136,0.12);
  border: 1px solid rgba(0,255,136,0.45);
  color: var(--accent-green);
  box-shadow: 0 0 8px rgba(0,255,136,0.25);
}
.online-badge.offline {
  background: rgba(255,51,102,0.10);
  border: 1px solid rgba(255,51,102,0.35);
  color: var(--accent-red);
}
.online-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.online-badge.online .online-dot {
  background: var(--accent-green);
  box-shadow: 0 0 6px var(--accent-green);
  animation: pulseDot 1.3s ease-in-out infinite;
}
.online-badge.offline .online-dot {
  background: var(--accent-red);
}
@keyframes pulseDot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.8); }
}

.saved-item .detail-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
}
.saved-item .detail-row .lbl {
  color: var(--text-muted);
  font-weight: 700;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  margin-right: 4px;
}
.saved-item .detail-row .val {
  color: #fff;
  word-break: break-all;
}
.saved-item .actions-row {
  display: flex;
  gap: 6px;
  justify-content: flex-end;
  flex-wrap: wrap;
}
.saved-item .mini-btn {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--text-muted);
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 11px;
  font-weight: 700;
  display: inline-flex; align-items: center; gap: 5px;
  transition: all 0.2s;
}
.saved-item .mini-btn:hover { color: var(--accent-cyan); border-color: var(--accent-cyan); }
.saved-item .mini-btn.danger:hover { color: var(--accent-red); border-color: var(--accent-red); }

.saved-warning {
  background: rgba(255,170,0,0.1);
  border: 1px solid rgba(255,170,0,0.35);
  color: var(--accent-amber);
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 11px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  line-height: 1.4;
}

.owner-row {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.owner-row .owner-tag {
  background: rgba(0,242,254,0.08);
  border: 1px solid rgba(0,242,254,0.25);
  color: var(--accent-cyan);
  padding: 1px 7px;
  border-radius: 4px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  font-weight: 700;
}

@media (max-width: 480px) {
  body { padding: 10px; }
  .card { padding: 24px 18px; border-radius: 20px; max-width: 100%; }
  .brand h1 { font-size: 19px; }
  .logo { width: 54px; height: 54px; font-size: 22px; }
  .tab-btn { font-size: 10px; padding: 9px 5px; }
  .tab-btn i { font-size: 11px; }
  .saved-item .nick { font-size: 13px; }
}
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="logo"><i class="fa-solid fa-shield-halved"></i></div>
    <h1>SECRET ADMIN</h1>
    <p>YASIN BHAI — Key Generator</p>
  </div>

  <div class="alert" id="admin-alert"><i class="fa-solid fa-triangle-exclamation"></i><span id="admin-alert-msg"></span></div>

  <!-- MASTER PASSWORD STEP -->
  <div id="admin-login-step">
    <form onsubmit="doAdminLogin(event)">
      <div class="form-group">
        <label>Master Password</label>
        <div class="input-wrap">
          <input type="password" class="input" id="master-pass" placeholder="Enter master password" autocomplete="off" required>
          <i class="fa-solid fa-lock"></i>
        </div>
      </div>
      <button type="submit" class="btn" id="admin-login-btn"><span>Unlock Panel</span><i class="fa-solid fa-shield-halved"></i></button>
    </form>
  </div>

  <!-- MAIN PANEL STEP -->
  <div id="admin-panel-step" style="display:none;">

    <!-- TABS -->
    <div class="tabs">
      <button class="tab-btn active" id="tab-generator" onclick="switchTab('generator')"><i class="fa-solid fa-key"></i> Key Gen</button>
      <button class="tab-btn" id="tab-saved" onclick="switchTab('saved')"><i class="fa-solid fa-database"></i> Saved Accounts</button>
    </div>

    <!-- ================== TAB 1: KEY GENERATOR ================== -->
    <div id="tab-content-generator">
      <!-- KEY NAME -->
      <div class="form-group">
        <label>🔑 Your Key Name</label>
        <div class="input-wrap">
          <input type="text" class="input" id="gen-custom-key"
                 placeholder="যেমন: YASIN FF"
                 autocomplete="off"
                 style="text-transform:uppercase;letter-spacing:1.5px;font-family:'JetBrains Mono',monospace;font-weight:700;"
                 oninput="updateKeyPreview()">
          <i class="fa-solid fa-key"></i>
        </div>
        <div class="name-preview" id="name-preview">
          <i class="fa-solid fa-circle-check"></i>
          <span>Final Key: <span class="preview-code" id="preview-code">YOUR-KEY-HERE</span></span>
        </div>
      </div>

      <!-- DURATION -->
      <div class="form-group">
        <label>⏱️ Duration (Days / Hours / Minutes)</label>
        <div class="preset-row">
          <button type="button" class="preset-btn" onclick="setPreset(0,1,0)">1 Hour</button>
          <button type="button" class="preset-btn" onclick="setPreset(0,12,0)">12 Hours</button>
          <button type="button" class="preset-btn" onclick="setPreset(1,0,0)">1 Day</button>
          <button type="button" class="preset-btn" onclick="setPreset(7,0,0)">7 Days</button>
        </div>
        <div class="time-row">
          <div class="time-box">
            <label>Days</label>
            <input type="number" id="gen-days" min="0" value="0">
          </div>
          <div class="time-box">
            <label>Hours</label>
            <input type="number" id="gen-hours" min="0" value="0">
          </div>
          <div class="time-box">
            <label>Minutes</label>
            <input type="number" id="gen-minutes" min="0" value="30">
          </div>
        </div>
      </div>

      <button class="btn" id="gen-btn" onclick="doGenerateKey()"><span>Generate Key</span><i class="fa-solid fa-wand-magic-sparkles"></i></button>

      <div class="key-result" id="key-result">
        <div class="key-label">Generated Key</div>
        <div class="key-value" id="generated-key">------</div>
        <button class="copy-btn" onclick="copyKey()"><i class="fa-solid fa-copy"></i> Copy Key</button>
      </div>

      <button class="btn secondary" style="margin-top:12px;" onclick="loadKeyList()">
        <i class="fa-solid fa-list"></i> <span>Show All Keys</span>
      </button>

      <div class="keys-list" id="keys-list"></div>
    </div>

    <!-- ================== TAB 2: SAVED ACCOUNTS ================== -->
    <div id="tab-content-saved" style="display:none;">
      <div class="saved-warning">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span>এই ডেটা শুধুমাত্র <b>তুমি (Admin)</b> দেখতে পারবে। ইউজাররা কখনোই এই সেভ করা অ্যাকাউন্ট দেখতে বা ডিলিট করতে পারবে না।</span>
      </div>

      <button class="btn secondary" onclick="loadSavedAccounts()">
        <i class="fa-solid fa-rotate"></i> <span>Refresh Saved List</span>
      </button>

      <div class="saved-list" id="saved-list"></div>
    </div>

  </div>

  <a class="back-link" href="/login"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
</div>

<script>
let currentMasterPass = '';
let currentTab = 'generator';

function showAlert(msg, success = false) {
  const el = document.getElementById('admin-alert');
  const msgEl = document.getElementById('admin-alert-msg');
  msgEl.innerText = msg;
  el.classList.toggle('success', success);
  el.classList.add('show');
  if (success) setTimeout(() => el.classList.remove('show'), 3500);
}
function hideAlert() { document.getElementById('admin-alert').classList.remove('show'); }

function escapeHtml(t) {
  return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ============ KEY PREVIEW ============
function updateKeyPreview() {
  const raw = document.getElementById('gen-custom-key').value.trim();
  const code = document.getElementById('preview-code');
  code.innerText = raw ? raw.toUpperCase() : 'YOUR-KEY-HERE';
}

// ============ DURATION PRESETS ============
function setPreset(d, h, m) {
  document.getElementById('gen-days').value = d;
  document.getElementById('gen-hours').value = h;
  document.getElementById('gen-minutes').value = m;
}

// ============ TABS ============
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-generator').classList.toggle('active', tab === 'generator');
  document.getElementById('tab-saved').classList.toggle('active', tab === 'saved');
  document.getElementById('tab-content-generator').style.display = (tab === 'generator') ? 'block' : 'none';
  document.getElementById('tab-content-saved').style.display = (tab === 'saved') ? 'block' : 'none';
  if (tab === 'saved') loadSavedAccounts();
}

// ============ ADMIN LOGIN ============
async function doAdminLogin(e) {
  e.preventDefault();
  const password = document.getElementById('master-pass').value;
  if (!password) return;
  const btn = document.getElementById('admin-login-btn');
  btn.disabled = true;
  hideAlert();
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ master_password: password })
    });
    const data = await res.json();
    if (data.status === 'ok') {
      currentMasterPass = password;
      document.getElementById('admin-login-step').style.display = 'none';
      document.getElementById('admin-panel-step').style.display = 'block';
    } else {
      showAlert(data.error || 'Wrong password');
    }
  } catch (err) {
    showAlert('Connection error');
  } finally {
    btn.disabled = false;
  }
}

// ============ GENERATE KEY ============
async function doGenerateKey() {
  const keyName = document.getElementById('gen-custom-key').value.trim();
  if (!keyName) {
    showAlert('Your Key Name লিখুন');
    return;
  }

  const days = parseInt(document.getElementById('gen-days').value) || 0;
  const hours = parseInt(document.getElementById('gen-hours').value) || 0;
  const minutes = parseInt(document.getElementById('gen-minutes').value) || 0;

  if (days === 0 && hours === 0 && minutes === 0) {
    showAlert('Set at least 1 minute');
    return;
  }

  const btn = document.getElementById('gen-btn');
  btn.disabled = true;
  hideAlert();

  try {
    const res = await fetch('/api/admin/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        master_password: currentMasterPass,
        user_name: keyName,
        days, hours, minutes,
        custom_key: keyName
      })
    });
    const data = await res.json();
    if (data.status === 'ok') {
      document.getElementById('generated-key').innerText = data.key_entry.key;
      document.getElementById('key-result').classList.add('show');
      const durText = `${days}d ${hours}h ${minutes}m`;
      showAlert(`Key "${data.key_entry.key}" created (${durText})`, true);
    } else {
      showAlert(data.error || 'Failed');
    }
  } catch (err) {
    showAlert('Connection error');
  } finally {
    btn.disabled = false;
  }
}

function copyKey() {
  const key = document.getElementById('generated-key').innerText;
  navigator.clipboard.writeText(key).then(() => {
    showAlert('Key copied to clipboard!', true);
  });
}

// ============ KEY LIST ============
async function loadKeyList() {
  hideAlert();
  const listEl = document.getElementById('keys-list');
  try {
    const res = await fetch('/api/admin/keys', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ master_password: currentMasterPass })
    });
    const data = await res.json();
    if (data.status !== 'ok') {
      showAlert(data.error || 'Failed');
      return;
    }
    if (!data.keys.length) {
      listEl.innerHTML = '<div class="empty-msg">No keys yet</div>';
    } else {
      listEl.innerHTML = data.keys.map(k => {
        const dur = `${k.days||0}d ${k.hours||0}h ${k.minutes||0}m`;
        let tag = '';
        if (k.revoked) tag = '<span class="tag red">Revoked</span>';
        else if (k.expired) tag = '<span class="tag amber">Expired</span>';
        else if (k.in_use) tag = '<span class="tag cyan">In Use</span>';
        else if (k.used) tag = '<span class="tag red">Used</span>';
        else tag = '<span class="tag green">Available</span>';

        let remainingText = '';
        if (!k.revoked && !k.expired) {
          const sec = k.remaining_sec || 0;
          const d = Math.floor(sec / 86400);
          const h = Math.floor((sec % 86400) / 3600);
          const m = Math.floor((sec % 3600) / 60);
          remainingText = `<span>⏳ ${d}d ${h}h ${m}m left</span>`;
        }

        const dead = k.revoked || k.expired;
        return `
          <div class="key-item ${dead ? 'revoked' : ''}">
            <div class="info">
              <div class="key-code">${escapeHtml(k.key)}</div>
              <div class="key-meta">
                <span>⏱️ ${dur}</span>
                ${remainingText}
                ${tag}
              </div>
            </div>
            <div class="actions">
              <button class="mini-btn" title="Copy" onclick="copyText('${k.key}')"><i class="fa-solid fa-copy"></i></button>
              ${!k.revoked ? `<button class="mini-btn" title="Revoke" onclick="revokeKey('${k.key}')"><i class="fa-solid fa-ban"></i></button>` : ''}
              <button class="mini-btn danger" title="Delete" onclick="deleteKey('${k.key}')"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        `;
      }).join('');
    }
    listEl.classList.add('show');
  } catch (err) {
    showAlert('Connection error');
  }
}

async function revokeKey(key) {
  if (!confirm('Revoke key ' + key + '?\nAll active sessions using this key will be logged out.')) return;
  const res = await fetch('/api/admin/revoke', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ master_password: currentMasterPass, key })
  });
  const data = await res.json();
  if (data.status === 'ok') {
    showAlert('Key revoked', true);
    loadKeyList();
  } else {
    showAlert(data.error || 'Failed');
  }
}

async function deleteKey(key) {
  if (!confirm('Delete key ' + key + ' permanently?')) return;
  const res = await fetch('/api/admin/delete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ master_password: currentMasterPass, key })
  });
  const data = await res.json();
  if (data.status === 'ok') {
    showAlert('Key deleted', true);
    loadKeyList();
  } else {
    showAlert(data.error || 'Failed');
  }
}

function copyText(t) {
  navigator.clipboard.writeText(t).then(() => showAlert('Copied: ' + t, true));
}

// ============ SAVED ACCOUNTS (ADMIN ONLY, with Online/Offline) ============
async function loadSavedAccounts() {
  hideAlert();
  const listEl = document.getElementById('saved-list');
  listEl.innerHTML = '<div class="empty-msg"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading...</div>';
  listEl.classList.add('show');

  try {
    const res = await fetch('/api/admin/saved_accounts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ master_password: currentMasterPass })
    });
    const data = await res.json();
    if (data.status !== 'ok') {
      listEl.innerHTML = `<div class="empty-msg">${escapeHtml(data.error || 'Failed')}</div>`;
      return;
    }
    const accs = data.accounts || [];
    if (!accs.length) {
      listEl.innerHTML = '<div class="empty-msg">এখনো কোনো অ্যাকাউন্ট সফলভাবে অনলাইন হয়নি।</div>';
      return;
    }

    listEl.innerHTML = accs.map((a, idx) => {
      const authType = a.auth_type === 'token' ? 'token' : 'guest';
      const typeLabel = authType === 'token' ? 'TOKEN' : 'UID+PASS';
      const nickname = escapeHtml(a.nickname || 'Unknown');
      const region = escapeHtml((a.region || 'BD').toUpperCase());
      const level = a.level || 1;
      const realId = escapeHtml(String(a.real_account_id || '-'));
      const inputUid = escapeHtml(String(a.input_uid || '-'));
      const inputPass = escapeHtml(String(a.input_password || '-'));
      const token = escapeHtml(String(a.access_token || '-'));
      const isOnline = !!a.online;
      const onlineClass = isOnline ? 'online' : 'offline';
      const onlineText = isOnline ? 'ONLINE' : 'OFFLINE';
      const onlineTime = a.last_online
        ? new Date(a.last_online * 1000).toLocaleString()
        : '-';
      const ownerKey = escapeHtml(String(a.owner_key || '-'));

      let credsHtml = '';
      if (authType === 'token') {
        credsHtml = `
          <div class="detail-row">
            <div><span class="lbl">Access Token:</span> <span class="val" id="tok-${idx}">${token}</span></div>
          </div>
        `;
      } else {
        credsHtml = `
          <div class="detail-row">
            <div><span class="lbl">Input UID:</span> <span class="val">${inputUid}</span></div>
            <div><span class="lbl">Password:</span> <span class="val" id="pwd-${idx}">${inputPass}</span></div>
          </div>
        `;
      }

      return `
        <div class="saved-item">
          <div class="top-row">
            <div class="nick">
              ${nickname}
              <span class="region-badge">${region}</span>
              <span class="level-badge">Lv ${level}</span>
              <span class="type-badge ${authType === 'token' ? 'token' : ''}">${typeLabel}</span>
            </div>
            <span class="online-badge ${onlineClass}">
              <span class="online-dot"></span> ${onlineText}
            </span>
          </div>

          <div class="detail-row">
            <div><span class="lbl">Game UID:</span> <span class="val">${realId}</span></div>
          </div>

          ${credsHtml}

          <div class="detail-row">
            <div><span class="lbl">Last Online:</span> <span class="val">${escapeHtml(onlineTime)}</span></div>
          </div>

          <div class="owner-row">
            <i class="fa-solid fa-key" style="color:var(--accent-cyan);"></i>
            <span>Owner Key:</span>
            <span class="owner-tag">${ownerKey}</span>
          </div>

          <div class="actions-row" style="margin-top:10px;">
            ${authType === 'token'
              ? `<button class="mini-btn" onclick="copyText(\`${token}\`)"><i class="fa-solid fa-copy"></i> Copy Token</button>`
              : `<button class="mini-btn" onclick="copyText(\`${inputUid}\`)"><i class="fa-solid fa-copy"></i> Copy UID</button>
                 <button class="mini-btn" onclick="copyText(\`${inputPass}\`)"><i class="fa-solid fa-copy"></i> Copy Pass</button>`
            }
            <button class="mini-btn danger" onclick="deleteSavedAccount('${escapeHtml(String(a.real_account_id || ''))}')"><i class="fa-solid fa-trash"></i> Delete</button>
          </div>
        </div>
      `;
    }).join('');
  } catch (err) {
    listEl.innerHTML = '<div class="empty-msg">Connection error</div>';
  }
}

async function deleteSavedAccount(realId) {
  if (!realId) return;
  if (!confirm('এই অ্যাকাউন্টটি অ্যাডমিন লিস্ট থেকে ডিলিট করতে চাও?\n\nGame UID: ' + realId)) return;
  try {
    const res = await fetch('/api/admin/saved_delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ master_password: currentMasterPass, real_account_id: realId })
    });
    const data = await res.json();
    if (data.status === 'ok') {
      showAlert('Saved account deleted', true);
      loadSavedAccounts();
    } else {
      showAlert(data.error || 'Failed');
    }
  } catch (err) {
    showAlert('Connection error');
  }
}
</script>
</body>
</html>
