<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#060913">
<title>YASIN BHAI | Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --bg-base: #060913;
  --bg-card: rgba(13, 19, 36, 0.75);
  --border-card: rgba(0, 242, 254, 0.18);
  --accent-cyan: #00f2fe;
  --accent-blue: #4facfe;
  --accent-purple: #7f00ff;
  --accent-pink: #ff2d95;
  --accent-red: #ff3366;
  --accent-green: #00ff88;
  --accent-amber: #ffaa00;
  --text-main: #f0f4fc;
  --text-muted: #8e9bb5;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overscroll-behavior: none; }
body {
  background: var(--bg-base);
  background-image: radial-gradient(circle at 15% 15%, rgba(127,0,255,0.25) 0%, transparent 45%),
                    radial-gradient(circle at 85% 85%, rgba(0,242,254,0.2) 0%, transparent 45%);
  color: var(--text-main);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background-attachment: fixed;
  overflow-x: hidden;
}
body::before, body::after {
  content: '';
  position: absolute;
  width: 300px; height: 300px;
  border-radius: 50%;
  filter: blur(120px);
  pointer-events: none;
}
body::before { background: rgba(0,242,254,0.15); top: 10%; left: 10%; animation: floatOrb 8s ease-in-out infinite; }
body::after { background: rgba(127,0,255,0.18); bottom: 10%; right: 10%; animation: floatOrb 10s ease-in-out infinite reverse; }
@keyframes floatOrb { 0%,100% { transform: translate(0,0) scale(1);} 50% { transform: translate(30px,-30px) scale(1.1);} }

.card {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: 24px;
  width: 100%;
  max-width: 420px;
  padding: 34px 26px;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 40px rgba(0,242,254,0.08);
  position: relative;
  z-index: 10;
  overflow: hidden;
  animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(24px);} to { opacity: 1; transform: translateY(0);} }
.card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
  background-size: 200% 100%;
  animation: shimmer 4s linear infinite;
}
@keyframes shimmer { 0% { background-position: 0% 0; } 100% { background-position: 200% 0; } }

.brand { text-align: center; margin-bottom: 24px; }
.logo {
  width: 64px; height: 64px; margin: 0 auto 14px;
  background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; color: #fff;
  box-shadow: 0 0 30px rgba(0,242,254,0.45);
  animation: pulseGlow 3s ease-in-out infinite;
}
@keyframes pulseGlow { 0%,100% { box-shadow: 0 0 30px rgba(0,242,254,0.45);} 50% { box-shadow: 0 0 45px rgba(0,242,254,0.7);} }
.brand h1 {
  font-size: 24px; font-weight: 800; letter-spacing: 2px;
  background: linear-gradient(90deg, #fff, var(--accent-cyan), #fff);
  background-size: 200% auto;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  animation: textShine 3.5s linear infinite;
}
@keyframes textShine { 0% { background-position: 0% center;} 100% { background-position: 200% center;} }
.brand p { font-size: 13px; color: var(--text-muted); margin-top: 6px; }

.form-group { margin-bottom: 14px; }
.form-group label {
  display: block; font-size: 11px; font-weight: 700;
  color: var(--text-muted); margin-bottom: 6px;
  text-transform: uppercase; letter-spacing: 0.6px;
}
.input-wrap { position: relative; }
.input-wrap i {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  color: var(--text-muted); font-size: 14px; pointer-events: none;
}
.input {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1.5px solid rgba(255,255,255,0.09);
  border-radius: 12px;
  padding: 13px 14px 13px 40px;
  color: #fff;
  font-size: 15px;
  outline: none;
  transition: all 0.25s;
  -webkit-appearance: none;
}
.input::placeholder { color: rgba(142,155,181,0.6); font-size: 14px; }
.input:focus {
  border-color: var(--accent-cyan);
  background: rgba(0,242,254,0.05);
  box-shadow: 0 0 0 4px rgba(0,242,254,0.08);
}

.btn {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
  color: #040914;
  font-size: 15px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 6px 20px rgba(0,242,254,0.35);
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin-top: 6px;
  -webkit-appearance: none;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(0,242,254,0.55); }
.btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

.alert {
  background: rgba(255,51,102,0.12);
  border: 1px solid rgba(255,51,102,0.35);
  color: var(--accent-red);
  padding: 11px 13px;
  border-radius: 11px;
  font-size: 13px;
  margin-bottom: 16px;
  display: none;
  align-items: center;
  gap: 9px;
}
.alert.show { display: flex; animation: shake 0.4s; }
.alert.success {
  background: rgba(0,255,136,0.12);
  border-color: rgba(0,255,136,0.35);
  color: var(--accent-green);
}
@keyframes shake { 0%,100% { transform: translateX(0);} 20% { transform: translateX(-6px);} 40% { transform: translateX(6px);} 60% { transform: translateX(-4px);} 80% { transform: translateX(4px);} }

.admin-link {
  display: block;
  text-align: center;
  margin-top: 18px;
  font-size: 12px;
  color: var(--text-muted);
  text-decoration: none;
  transition: color 0.2s;
  font-weight: 600;
  letter-spacing: 0.4px;
}
.admin-link:hover { color: var(--accent-cyan); }
.admin-link i { margin-right: 5px; }
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="logo"><i class="fa-solid fa-bolt"></i></div>
    <h1>YASIN BHAI</h1>
    <p>Level Up Bot — Access Portal</p>
  </div>

  <div class="alert" id="user-alert"><i class="fa-solid fa-triangle-exclamation"></i><span id="user-alert-msg"></span></div>
  <form onsubmit="doUserLogin(event)">
    <div class="form-group">
      <label>Access Key</label>
      <div class="input-wrap">
        <input type="text" class="input" id="user-key" placeholder="Enter your key" autocomplete="off" required>
        <i class="fa-solid fa-key"></i>
      </div>
    </div>
    <button type="submit" class="btn" id="user-login-btn"><span>Login</span><i class="fa-solid fa-arrow-right"></i></button>
  </form>

<script>
function showAlert(msg, success = false) {
  const el = document.getElementById('user-alert');
  const msgEl = document.getElementById('user-alert-msg');
  msgEl.innerText = msg;
  el.classList.toggle('success', success);
  el.classList.add('show');
}
function hideAlert() {
  document.getElementById('user-alert').classList.remove('show');
}

async function doUserLogin(e) {
  e.preventDefault();
  const key = document.getElementById('user-key').value.trim().toUpperCase();
  if (!key) return;
  const btn = document.getElementById('user-login-btn');
  btn.disabled = true;
  hideAlert();
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key })
    });
    const data = await res.json();
    if (data.status === 'ok') {
      // Redirect with login=success + key param so index.html knows to show welcome popup
      window.location.href = '/?login=success&key=' + encodeURIComponent(key);
    } else {
      showAlert(data.error || 'Login failed');
    }
  } catch (err) {
    showAlert('Connection error');
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
