<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#060913">
<title>YASIN BHAI | Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --bg-base: #060913;
  --bg-card: rgba(13, 19, 36, 0.75);
  --border-card: rgba(0, 242, 254, 0.18);
  --accent-cyan: #00f2fe;
  --accent-blue: #4facfe;
  --accent-purple: #7f00ff;
  --accent-pink: #ff2d95;
  --accent-red: #ff3366;
  --accent-green: #00ff88;
  --text-main: #f0f4fc;
  --text-muted: #8e9bb5;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overscroll-behavior: none; }
body {
  background: var(--bg-base);
  background-image: radial-gradient(circle at 15% 15%, rgba(127,0,255,0.25) 0%, transparent 45%),
                    radial-gradient(circle at 85% 85%, rgba(0,242,254,0.2) 0%, transparent 45%);
  color: var(--text-main);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background-attachment: fixed;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
body::before, body::after {
  content: '';
  position: absolute;
  width: 300px; height: 300px;
  border-radius: 50%;
  filter: blur(120px);
  pointer-events: none;
  will-change: transform;
}
body::before { background: rgba(0,242,254,0.15); top: 10%; left: 10%; }
body::after { background: rgba(127,0,255,0.18); bottom: 10%; right: 10%; }

.card {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: 24px;
  width: 100%;
  max-width: 420px;
  padding: 34px 26px;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 40px rgba(0,242,254,0.08);
  position: relative;
  z-index: 10;
  overflow: hidden;
}
.card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
  background-size: 200% 100%;
  animation: shimmer 4s linear infinite;
  will-change: background-position;
}
@keyframes shimmer { 0% { background-position: 0% 0; } 100% { background-position: 200% 0; } }

.brand { text-align: center; margin-bottom: 24px; }
.logo {
  width: 64px; height: 64px; margin: 0 auto 14px;
  background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; color: #fff;
  box-shadow: 0 0 30px rgba(0,242,254,0.45);
}
.brand h1 {
  font-size: 24px; font-weight: 800; letter-spacing: 2px;
  background: linear-gradient(90deg, #fff, var(--accent-cyan), #fff);
  background-size: 200% auto;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  animation: textShine 4s linear infinite;
  will-change: background-position;
}
@keyframes textShine { 0% { background-position: 0% center;} 100% { background-position: 200% center;} }
.brand p { font-size: 13px; color: var(--text-muted); margin-top: 6px; }

.form-group { margin-bottom: 14px; }
.form-group label {
  display: block; font-size: 11px; font-weight: 700;
  color: var(--text-muted); margin-bottom: 6px;
  text-transform: uppercase; letter-spacing: 0.6px;
}
.input-wrap { position: relative; }
.input-wrap > i.lock-icon {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  color: var(--text-muted); font-size: 14px; pointer-events: none;
  z-index: 2;
}
.input {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1.5px solid rgba(255,255,255,0.09);
  border-radius: 12px;
  padding: 13px 44px 13px 40px;
  color: #fff;
  font-size: 15px;
  outline: none;
  transition: border-color 0.25s, background 0.25s;
  -webkit-appearance: none;
}
.input::placeholder { color: rgba(142,155,181,0.6); font-size: 14px; }
.input:focus {
  border-color: var(--accent-cyan);
  background: rgba(0,242,254,0.05);
}

/* ✅ Eye toggle moved inside — no more overflow */
.toggle-pass {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 14px;
  cursor: pointer;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  transition: color 0.2s, background 0.2s, border-color 0.2s;
  z-index: 3;
}
.toggle-pass:hover {
  color: var(--accent-cyan);
  background: rgba(0,242,254,0.08);
  border-color: rgba(0,242,254,0.3);
}
.toggle-pass:active { transform: translateY(-50%) scale(0.9); }

.btn {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
  color: #040914;
  font-size: 15px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 6px 20px rgba(0,242,254,0.35);
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin-top: 6px;
  -webkit-appearance: none;
}
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }

.alert {
  background: rgba(255,51,102,0.12);
  border: 1px solid rgba(255,51,102,0.35);
  color: var(--accent-red);
  padding: 11px 13px;
  border-radius: 11px;
  font-size: 13px;
  margin-bottom: 16px;
  display: none;
  align-items: center;
  gap: 9px;
}
.alert.show { display: flex; }
.alert.success {
  background: rgba(0,255,136,0.12);
  border-color: rgba(0,255,136,0.35);
  color: var(--accent-green);
}

/* ✅ Get Key / Get Password link */
.getkey-section {
  margin-top: 18px;
  text-align: center;
}
.getkey-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 22px;
  border-radius: 12px;
  background: rgba(0, 136, 204, 0.12);
  border: 1px solid rgba(0, 136, 204, 0.35);
  color: #4dbeff;
  font-size: 13px;
  font-weight: 700;
  text-decoration: none;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  transition: background 0.25s, border-color 0.25s, transform 0.15s, box-shadow 0.25s;
  width: 100%;
  box-shadow: 0 0 12px rgba(0, 136, 204, 0.15);
}
.getkey-link:hover {
  background: rgba(0, 136, 204, 0.22);
  border-color: rgba(0, 136, 204, 0.6);
  box-shadow: 0 0 20px rgba(0, 136, 204, 0.35);
  color: #7ed0ff;
}
.getkey-link:active { transform: scale(0.97); }
.getkey-link i.fa-telegram {
  font-size: 16px;
}
.getkey-link .arrow {
  font-size: 11px;
  opacity: 0.7;
  margin-left: auto;
}

@media (max-width: 480px) {
  body { padding: 14px; }
  .card { padding: 28px 20px; border-radius: 20px; }
  .logo { width: 56px; height: 56px; font-size: 24px; border-radius: 16px; }
  .brand h1 { font-size: 20px; letter-spacing: 1.5px; }
  .brand p { font-size: 12px; }
  .input { padding: 12px 42px 12px 38px; font-size: 14px; }
  .btn { padding: 13px; font-size: 14px; }
  .toggle-pass { width: 30px; height: 30px; right: 7px; font-size: 13px; }
  .getkey-link { font-size: 12px; padding: 11px 18px; }
}

@media (max-width: 360px) {
  .card { padding: 24px 16px; }
  .brand h1 { font-size: 18px; }
  .input { font-size: 13px; padding: 11px 40px 11px 36px; }
  .toggle-pass { width: 28px; height: 28px; right: 6px; font-size: 12px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="logo"><i class="fa-solid fa-bolt"></i></div>
    <h1>YASIN BHAI</h1>
    <p>Level Up Bot — Access Portal</p>
  </div>

  <div class="alert" id="user-alert"><i class="fa-solid fa-triangle-exclamation"></i><span id="user-alert-msg"></span></div>
  <form onsubmit="doUserLogin(event)">
    <div class="form-group">
      <label>Access Password</label>
      <div class="input-wrap">
        <input type="password" class="input" id="user-password" placeholder="Enter password" autocomplete="current-password" required>
        <i class="fa-solid fa-lock lock-icon"></i>
        <button type="button" class="toggle-pass" onclick="togglePasswordVisibility()" tabindex="-1" aria-label="Toggle password visibility">
          <i class="fa-solid fa-eye" id="toggle-eye"></i>
        </button>
      </div>
    </div>
    <button type="submit" class="btn" id="user-login-btn"><span>Login</span><i class="fa-solid fa-arrow-right"></i></button>
  </form>

  <!-- ✅ Get Key / Get Password via Telegram -->
  <div class="getkey-section">
    <a href="https://t.me/freefireob51" target="_blank" rel="noopener" class="getkey-link">
      <i class="fa-brands fa-telegram"></i>
      <span>Get Password</span>
      <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
    </a>
  </div>
</div>

<script>
function showAlert(msg, success = false) {
  const el = document.getElementById('user-alert');
  const msgEl = document.getElementById('user-alert-msg');
  msgEl.innerText = msg;
  el.classList.toggle('success', success);
  el.classList.add('show');
}
function hideAlert() {
  document.getElementById('user-alert').classList.remove('show');
}

function togglePasswordVisibility() {
  const input = document.getElementById('user-password');
  const eye = document.getElementById('toggle-eye');
  if (input.type === 'password') {
    input.type = 'text';
    eye.classList.remove('fa-eye');
    eye.classList.add('fa-eye-slash');
  } else {
    input.type = 'password';
    eye.classList.remove('fa-eye-slash');
    eye.classList.add('fa-eye');
  }
}

async function doUserLogin(e) {
  e.preventDefault();
  const password = document.getElementById('user-password').value;
  if (!password) return;
  const btn = document.getElementById('user-login-btn');
  btn.disabled = true;
  hideAlert();
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password })
    });
    const data = await res.json();
    if (data.status === 'ok') {
      window.location.href = '/?login=success';
    } else {
      showAlert(data.error || 'Login failed');
    }
  } catch (err) {
    showAlert('Connection error');
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
